<g fill="#17779b"><path d="M231 250 l7 6 -7 6z M414 250 l7 6 -7 6z M603 250 l7 6 -7 6z M790 250 l7 6 -7 6z"/></g>
<rect x="245" y="350" width="220" height="70" rx="10" fill="#ecf5f7" stroke="#17779b"/>
<text x="355" y="379" font-family="Arial,sans-serif" font-size="17" fill="#15334A" text-anchor="middle" font-weight="bold">ELT warehouse</text>
<text x="355" y="401" font-family="Arial,sans-serif" font-size="13" fill="#4a5862" text-anchor="middle">Proposed independent compute</text>
