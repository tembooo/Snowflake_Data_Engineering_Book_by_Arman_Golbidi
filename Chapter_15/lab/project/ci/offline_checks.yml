name: Capstone offline acceptance
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic tests without secrets
        run: python -m unittest discover -s project/tests -v
      - name: Export fixture result
        run: python project/python/capstone.py
